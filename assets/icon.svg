<!-- Secrets app icon (source for icon-256.png, icon.ico and AppIcon.icns; run `just icon`).
     A padlock beside the vault it guards: a header row, then secret rows split into
     [name | masked value] cells, with the values shown as password dots and the top
     two names lit. Matches the DataWorx/NovaMail icon family: dark body, soft glow,
     gradient glyph, hairline edge. Drawn on Apple's macOS icon grid: an 824×824
     rounded square inset 100px in a 1024×1024 canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Green-tinted charcoal body, lighter at the top. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242A28"/>
      <stop offset="1" stop-color="#0F1211"/>
    </linearGradient>
    <!-- Faint emerald glow behind the padlock. -->
    <radialGradient id="glow" cx="0.33" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <!-- Padlock colour: mint into emerald. -->
    <linearGradient id="vault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.35"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Body, glow, and a hairline top highlight for a slightly raised edge. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="4"/>

  <!-- Nudged up so the padlock and vault sit on the optical centre. -->
  <g filter="url(#lift)" transform="translate(0,-18)">
    <!-- The padlock: a stroked shackle over a solid body with a keyhole. -->
    <path d="M254,500 V418 A64,64 0 0 1 382,418 V500" fill="none" stroke="url(#vault)"
          stroke-width="52" stroke-linecap="round"/>
    <rect x="208" y="476" width="220" height="252" rx="56" fill="url(#vault)"/>
    <circle cx="318" cy="582" r="30" fill="#141917"/>
    <rect x="304" y="590" width="28" height="70" rx="14" fill="#141917"/>

    <!-- Vault: a bright header row, then secret rows as [name | ••••] cells. -->
    <rect x="490" y="328" width="314" height="52" rx="26" fill="#FAFAFA"/>

    <rect x="490" y="420" width="96" height="52" rx="26" fill="#6EE7B7"/>
    <g fill="#D4D4D8">
      <circle cx="638" cy="446" r="22"/><circle cx="694" cy="446" r="22"/>
      <circle cx="750" cy="446" r="22"/>
    </g>

    <rect x="490" y="512" width="96" height="52" rx="26" fill="#34D399"/>
    <g fill="#D4D4D8">
      <circle cx="638" cy="538" r="22"/><circle cx="694" cy="538" r="22"/>
    </g>

    <rect x="490" y="604" width="96" height="52" rx="26" fill="#71717A"/>
    <g fill="#A1A1AA">
      <circle cx="638" cy="630" r="22"/><circle cx="694" cy="630" r="22"/>
      <circle cx="750" cy="630" r="22"/>
    </g>

    <rect x="490" y="696" width="96" height="52" rx="26" fill="#52525B"/>
    <g fill="#71717A">
      <circle cx="638" cy="722" r="22"/><circle cx="694" cy="722" r="22"/>
    </g>
  </g>
</svg>
